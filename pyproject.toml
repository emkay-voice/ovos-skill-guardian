[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-skill-guardian"
version = "0.1.0a4"
description = "OpenVoiceOS skill: your privacy by voice. What the assistant sent out today, who hears what you say, and going offline (local only)"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Andreas Lorensen"}]
requires-python = ">=3.10"
keywords = ["ovos", "openvoiceos", "skill", "privacy", "network", "emkay"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "ovos-utils>=0.0.38",
    "ovos-workshop>=0.0.15,<10.0.0",
]

[project.optional-dependencies]
test = ["pytest", "ovos-bus-client"]

[project.urls]
Homepage = "https://github.com/emkay-voice/ovos-skill-guardian"
Issues = "https://github.com/emkay-voice/ovos-skill-guardian/issues"
Emkay = "https://github.com/emkay-voice/emkay"
Icon = "https://raw.githubusercontent.com/emkay-voice/ovos-skill-guardian/main/res/icon.png"

[project.entry-points."opm.skill"]
"ovos-skill-guardian.emkay-voice" = "ovos_skill_guardian:GuardianSkill"

[tool.setuptools]
packages = ["ovos_skill_guardian"]

[tool.setuptools.package-dir]
ovos_skill_guardian = ""

[tool.setuptools.package-data]
ovos_skill_guardian = ["locale/**/*", "settingsmeta.json"]
