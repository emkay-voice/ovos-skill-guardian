[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-skill-guardian"
version = "0.1.0a8"
description = "OpenVoiceOS skill: your privacy by voice. What the assistant sent out today, what just happened, who hears what you say, and going offline (local only)"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Andreas Lorensen"}]
requires-python = ">=3.10"
keywords = ["ovos", "openvoiceos", "skill", "privacy", "network", "emkay"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "ovos-utils>=0.0.38",
    "ovos-workshop>=0.0.15,<10.0.0",
]

[project.optional-dependencies]
test = ["pytest", "ovos-bus-client", "fastapi", "httpx"]

[project.urls]
Homepage = "https://github.com/emkay-voice/ovos-skill-guardian"
Issues = "https://github.com/emkay-voice/ovos-skill-guardian/issues"
Emkay = "https://github.com/emkay-voice/emkay"
Icon = "https://raw.githubusercontent.com/emkay-voice/ovos-skill-guardian/main/res/icon.png"

[project.entry-points."opm.skill"]
"ovos-skill-guardian.emkay-voice" = "ovos_skill_guardian:GuardianSkill"

# A page in ovos-control-panel (see panel/__init__.py). Only the panel loads it.
[project.entry-points."opm.control_panel.page"]
guardian = "ovos_skill_guardian.panel:PAGE"

[tool.setuptools]
packages = ["ovos_skill_guardian", "ovos_skill_guardian.panel"]

[tool.setuptools.package-dir]
ovos_skill_guardian = ""
"ovos_skill_guardian.panel" = "panel"

[tool.setuptools.package-data]
ovos_skill_guardian = ["locale/**/*", "settingsmeta.json"]
"ovos_skill_guardian.panel" = ["page.html", "icon.svg", "i18n/*.json"]
